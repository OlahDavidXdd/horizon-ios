name: Publish verified Android artifact
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Android APK workflow run ID
        required: true
        type: string
      tag:
        description: Existing draft release tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.repository == 'OlahDavidXdd/horizon-ios' && github.ref == 'refs/heads/android-port'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: horizon-android
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Verify provenance and publish existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.source_run }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^android-v[0-9.]+-build-[0-9]+$ ]]
          expected=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          test "$(cat source-commit.txt)" = "$expected"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          sha256sum --check Horizon-Android.apk.sha256
          gh release upload "$RELEASE_TAG" Horizon-Android.apk Horizon-Android.apk.sha256 source-commit.txt native-source-commit.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
