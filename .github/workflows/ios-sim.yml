name: ios-sim
# The game in the iOS Simulator: horizon-client cross-compiled for aarch64-apple-ios-sim, bundled as ios.yml bundles
# the device build, installed on a fresh simulator with the game files in its Documents, and driven over its control
# socket (tools/ci/ctl.py: no game build for the Mac itself) through the same fixed scenes as linux.yml, each one a
# `simctl io screenshot` of the simulator's own screen. Artifacts: ios-screenshots (with a video of the run and the
# game's logs) and ios-simulator-app. Unsigned throughout: a simulator needs no Apple account. See CI.md.
on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'PROJECT/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'PROJECT/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-sim-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  HORIZON_TELEMETRY_URL: "off"
  TARGET: aarch64-apple-ios-sim
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  BUNDLE_ID: dev.horizon.game

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios-sim
          save-if: ${{ github.event_name != 'pull_request' }}
      # The phone build's features (ios.yml): sound through CoreAudio, no desktop controller stack.
      - name: Build the game for the simulator
        run: |
          cargo build --profile fast --locked --target "$TARGET" -p horizon-client --bin horizon-client \
            --no-default-features --features audio 2>&1 | tail -40
          test -x "target/$TARGET/fast/horizon-client"
      - name: Bundle it
        run: |
          app=sim/Horizon.app
          rm -rf sim && mkdir -p "$app"
          cp "target/$TARGET/fast/horizon-client" "$app/Horizon"
          cp packaging/ios/GameInfo.plist "$app/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleSupportedPlatforms" "$app/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleSupportedPlatforms array" -c "Add :CFBundleSupportedPlatforms:0 string iPhoneSimulator" "$app/Info.plist"
          printf 'APPL????' > "$app/PkgInfo"
          codesign --force --sign - "$app"
          (cd sim && zip -qry ../Horizon-simulator.app.zip Horizon.app)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: Horizon-simulator.app.zip
          retention-days: 7
      - name: Which game files
        id: files
        run: |
          tag=$(curl -sfI https://cdn.gayfeet.lol/horizon/26.3.zip | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}' | tr -dc 'A-Za-z0-9')
          echo "tag=${tag:-none}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: gamefiles
          key: gamefiles-mac-26.3-${{ steps.files.outputs.tag }}
      - name: Download the game files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sfL --retry 5 -C - -o files.zip https://cdn.gayfeet.lol/horizon/26.3.zip
          mkdir -p gamefiles && unzip -q files.zip -d gamefiles && rm files.zip
      - name: Boot a simulator
        id: sim
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['platform']=='iOS' and x['isAvailable']]; print(r[-1]['identifier'])")
          device=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; d=[x for x in json.load(sys.stdin)['devicetypes'] if x['name'].startswith('iPhone') and 'Pro' in x['name'] and 'Max' not in x['name']]; print(d[-1]['identifier'])")
          echo "runtime $runtime, device $device"
          udid=$(xcrun simctl create horizon-ci "$device" "$runtime")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Install the game and its files
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl install "$UDID" sim/Horizon.app
          data=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          mkdir -p "$data/Documents"
          cp -R gamefiles/26.3 "$data/Documents/resources"
          echo "DATA=$data" >> "$GITHUB_ENV"
      - name: Draw the scenes
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          mkdir -p ios-screenshots
          xcrun simctl io "$UDID" recordVideo --codec h264 ios-screenshots/run.mp4 & video=$!
          # The game runs in Documents: a relative socket stays under macOS's 104-byte socket path limit.
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" --control-socket ctl.sock > ios-screenshots/console.log 2>&1 &
          status=0
          python3 tools/ci/screenshots.py --ctl tools/ci/ctl.py --attach ctl.sock --cwd "$DATA/Documents" \
            --shot-cmd "xcrun simctl io $UDID screenshot {path}" --out ios-screenshots || status=$?
          kill -INT $video || true
          sleep 3
          cp -R "$DATA/Documents/logs" ios-screenshots/game-logs 2>/dev/null || true
          exit $status
      - name: Contact sheet
        if: always()
        run: |
          python3 -m pip install --quiet --break-system-packages pillow 2>/dev/null || python3 -m pip install --quiet pillow || true
          python3 tools/ci/contact_sheet.py ios-screenshots ios-screenshots/sheet.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios-screenshots
          retention-days: 14
