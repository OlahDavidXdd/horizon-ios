name: android
on:
  workflow_dispatch:
    inputs:
      signed_artifact_ref:
        description: Temporary branch or commit holding the permanently signed APK (optional)
        type: string
        default: ''
      existing_run:
        description: Republish the verified APK artifact from an earlier Android run (leave empty for a new build)
        type: string
        default: ''
      launcher_only:
        description: Reuse the verified build-25 native library if native sources are unchanged
        type: boolean
        default: false
      publish_release:
        description: Publish the verified APK as a GitHub prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: 'off'
  ANDROID_TARGET: aarch64-linux-android
  ANDROID_API: '26'
  CARGO_INCREMENTAL: '0'
  EXPECTED_ANDROID_CERT_SHA256: dbdefbbbd6f467d8737042f4f4de93c360d5f98c341a1e4d79938bba1fd17a01
jobs:
  apk:
    if: inputs.existing_run == '' && inputs.signed_artifact_ref == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test resource preflight and read-only verification
        run: |
          mkdir -p "$RUNNER_TEMP/resource-tests"
          javac -d "$RUNNER_TEMP/resource-tests" packaging/android/app/src/main/java/dev/horizon/android/PreparedResources.java packaging/android/tests/PreparedResourcesTest.java
          java -cp "$RUNNER_TEMP/resource-tests" dev.horizon.android.PreparedResourcesTest
      - name: Test native glass finger tracking
        run: |
          javac -d "$RUNNER_TEMP/resource-tests" packaging/android/app/src/main/java/dev/horizon/android/GlassDragState.java packaging/android/tests/GlassDragStateTest.java
          java -cp "$RUNNER_TEMP/resource-tests" dev.horizon.android.GlassDragStateTest
      - name: Test refresh-rate selection and startup surface lifecycle
        run: |
          javac -d "$RUNNER_TEMP/resource-tests" packaging/android/app/src/main/java/dev/horizon/android/RefreshRatePolicy.java packaging/android/app/src/main/java/dev/horizon/android/LaunchSurfaceState.java packaging/android/tests/DisplayStartupTest.java
          java -cp "$RUNNER_TEMP/resource-tests" dev.horizon.android.DisplayStartupTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_TARGET }}
      - name: Test Android surface lifecycle ordering
        run: |
          rustc --edition=2024 --test crates/horizon-client-render/src/gfx/android_surface.rs -o "$RUNNER_TEMP/android-surface-tests"
          "$RUNNER_TEMP/android-surface-tests"
      - name: Test Max Performance distance preservation
        run: |
          rustc --edition=2024 --test packaging/android/tests/max_performance.rs -o "$RUNNER_TEMP/max-performance-tests"
          "$RUNNER_TEMP/max-performance-tests"
      - name: Test interrupted native imports
        run: |
          rustc --edition=2024 --test packaging/android/tests/import_transaction.rs -o "$RUNNER_TEMP/import-transaction-tests"
          "$RUNNER_TEMP/import-transaction-tests"
      - name: Test pre-game mod management
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/mobile-mod-tests
        run: cargo test --locked --manifest-path packaging/android/tests/mobile_mods/Cargo.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/horizon-android
          shared-key: android-${{ env.ANDROID_TARGET }}
          cache-on-failure: true
      - name: Build shared game and launcher bridge
        env:
          HORIZON_MSA_CLIENT_ID: 331e08f8-172d-43b9-835a-3108c2fcdbf3
          LAUNCHER_ONLY: ${{ inputs.launcher_only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android$ANDROID_API-clang"
          export CXX_aarch64_linux_android="$bin/aarch64-linux-android$ANDROID_API-clang++"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          so="crates/horizon-android/target/$ANDROID_TARGET/release/libhorizon_android.so"
          if [ "$LAUNCHER_ONLY" = true ]; then
            # This baseline was built with these exact native options. Reject a
            # launcher-only request if any engine, dependency or native build input changed.
            baseline=ec7745777b9dae47c578f998b19bfd0493306e65
            test "$ANDROID_TARGET" = aarch64-linux-android
            test "$ANDROID_API" = 26
            test "$HORIZON_TELEMETRY_URL" = off
            test "$HORIZON_MSA_CLIENT_ID" = 331e08f8-172d-43b9-835a-3108c2fcdbf3
            git fetch --depth=1 origin "$baseline"
            git diff --name-only "$baseline" "$GITHUB_SHA" > "$RUNNER_TEMP/native-input-changes.txt"
            python3 - "$RUNNER_TEMP/native-input-changes.txt" <<'PYCODE'
          import pathlib, sys
          changed = pathlib.Path(sys.argv[1]).read_text().splitlines()
          forbidden = [p for p in changed if not (p.startswith("packaging/android/") or p in {".github/workflows/android.yml", "tools/check_public_tree.py", ".gitignore", "THIRD_PARTY_NOTICES.md"})]
          if forbidden:
              raise SystemExit("Native inputs changed; run a full Android build: " + ", ".join(forbidden))
          PYCODE
            original="$RUNNER_TEMP/native-baseline"
            mkdir -p "$original" "$(dirname "$so")"
            gh release download android-v0.2.102-build-25 --repo "$GITHUB_REPOSITORY" --dir "$original" \
              --pattern 'Horizon-Android.apk*' --pattern source-commit.txt
            test "$(cat "$original/source-commit.txt")" = "$baseline"
            ( cd "$original" && sha256sum --check Horizon-Android.apk.sha256 )
            unzip -p "$original/Horizon-Android.apk" lib/arm64-v8a/libhorizon_android.so > "$so"
            printf '%s\n' "$baseline" > native-source-commit.txt
          else
            cargo build --release --locked --manifest-path crates/horizon-android/Cargo.toml --target "$ANDROID_TARGET"
            printf '%s\n' "$GITHUB_SHA" > native-source-commit.txt
          fi
          "$bin/llvm-nm" -D --defined-only "$so" > /tmp/horizon-symbols.txt
          grep -q ' ANativeActivity_onCreate$' /tmp/horizon-symbols.txt
          grep -q ' Java_dev_horizon_android_HorizonActivity_submit$' /tmp/horizon-symbols.txt
          python3 - <<'PYCODE'
          import pathlib, re
          java = pathlib.Path("packaging/android/app/src/main/java/dev/horizon/android/HorizonActivity.java").read_text()
          symbols = pathlib.Path("/tmp/horizon-symbols.txt").read_text()
          methods = re.findall(r"\bnative\s+[\w\[\]]+\s+(\w+)\(", java)
          missing = [m for m in methods if "Java_dev_horizon_android_HorizonActivity_" + m not in symbols]
          if missing:
              raise SystemExit("Missing JNI methods: " + ", ".join(missing))
          PYCODE
          mkdir -p packaging/android/app/src/main/jniLibs/arm64-v8a
          cp "$so" packaging/android/app/src/main/jniLibs/arm64-v8a/
      - name: Build and verify launcher APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          HORIZON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HORIZON_ANDROID_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export HORIZON_KEYSTORE="$RUNNER_TEMP/horizon.jks"
          trap 'if [ -n "${HORIZON_KEYSTORE:-}" ]; then rm -f "$HORIZON_KEYSTORE"; fi' EXIT
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$HORIZON_KEYSTORE"
          else
            echo '::notice::Signing secrets are absent. Building an unsigned artifact for private permanent-key signing; it cannot be published unsigned.'
            unset HORIZON_KEYSTORE_PASSWORD HORIZON_KEYSTORE
          fi
          gradle -p packaging/android --no-daemon assembleRelease lintRelease :app:testResourceVolumeAssembly
          if [ -n "$KEYSTORE" ]; then
            apk=Horizon-Android.apk
            cp packaging/android/app/build/outputs/apk/release/app-release.apk "$apk"
          else
            apk=Horizon-Android-unsigned.apk
            cp packaging/android/app/build/outputs/apk/release/app-release-unsigned.apk "$apk"
          fi
          tools=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          if [ "$apk" = Horizon-Android.apk ]; then
            "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/signature.txt"
            cat "$RUNNER_TEMP/signature.txt"
            actual=$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*/\1/p' "$RUNNER_TEMP/signature.txt" | tr '[:upper:]' '[:lower:]' | sort -u)
            test "$actual" = "$EXPECTED_ANDROID_CERT_SHA256"
          fi
          "$tools/aapt" dump badging "$apk" | tee /tmp/horizon-badging.txt
          grep -q "launchable-activity: name='dev.horizon.android.HorizonActivity'" /tmp/horizon-badging.txt
          unzip -l "$apk" | grep 'lib/arm64-v8a/libhorizon_android.so'
          sha256sum "$apk" > "$apk.sha256"
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-android
          path: |
            Horizon-Android*.apk
            Horizon-Android*.apk.sha256
            source-commit.txt
            native-source-commit.txt
          retention-days: 14
          if-no-files-found: error
  release:
    needs: apk
    if: always() && inputs.publish_release && (needs.apk.result == 'success' || inputs.existing_run != '') && github.repository == 'OlahDavidXdd/horizon-ios' && github.ref == 'refs/heads/android-port'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        if: inputs.signed_artifact_ref == ''
        with:
          name: horizon-android
          run-id: ${{ inputs.existing_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: inputs.signed_artifact_ref != ''
        with:
          ref: ${{ inputs.signed_artifact_ref }}
          path: signed-apk
          persist-credentials: false
      - name: Read signed publication artifact
        if: inputs.signed_artifact_ref != ''
        run: cp signed-apk/Horizon-Android.apk signed-apk/Horizon-Android.apk.sha256 signed-apk/source-commit.txt signed-apk/native-source-commit.txt .
      - name: Publish APK from this successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN: ${{ inputs.existing_run || github.run_id }}
        run: |
          set -euo pipefail
          expected=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)
          number=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .run_number)
          test "$(cat source-commit.txt)" = "$expected"
          test -f Horizon-Android.apk || { echo 'No signed APK. Configure the permanent-key signing secrets or provide a locally signed artifact.'; exit 1; }
          sha256sum --check Horizon-Android.apk.sha256
          tools=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs Horizon-Android.apk > "$RUNNER_TEMP/signature.txt"
          cat "$RUNNER_TEMP/signature.txt"
          actual=$(sed -nE 's/.*certificate SHA-256 digest: ([[:xdigit:]]{64}).*/\1/p' "$RUNNER_TEMP/signature.txt" | tr '[:upper:]' '[:lower:]' | sort -u)
          test "$actual" = "$EXPECTED_ANDROID_CERT_SHA256"
          "$tools/aapt" dump badging Horizon-Android.apk | grep "versionCode='$number'"
          tag="android-v0.2.103-build-${number}"
          cat > notes.md <<'NOTES'
          Restores the pre-WeaveMask zakisheriff/Liquid-Glass launcher bar and the native finger-tracking pill. Retains bundled offline assets, reduced-transparency preference and native fallback. Repeated WebView failure callbacks now detach the failed view only once. WeaveMask shader code is removed.

          Fixes an Android renderer lifecycle bug: after native-window destruction, queued resizes must not unpause rendering or allocate an offscreen target. Resizes are deferred until the native surface returns, duplicate resumes keep a live swapchain, and resume respects zero-size suspension while refreshing size-dependent targets. Completed CPU loads wait for a drawable target before world-renderer creation; explicit offscreen targets retain their requested dimensions. Includes regression tests for late resize, duplicate resume and explicit offscreen rendering. This fixes a concrete lifecycle failure; the reported intermittent Play crash still needs a device trace to confirm its cause.

          Share Logs now includes bounded startup lifecycle records (surface events, startup phases and app pause/resume), alongside existing engine logs and Android process-exit traces. No account responses, commands or credentials are recorded.

          Keeps Max Performance, your selected chunk render distance, 120 Hz support, downloads/imports and the permanent signing key. Install over 0.2.101/0.2.102 without uninstalling to retain files. Full native rebuild. ARM64 Android 8+ with Vulkan. Physical-device confirmation is still needed.
          NOTES
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$expected" --title "Horizon Android 0.2.103 · build ${number}" --notes-file notes.md --prerelease --draft
          gh release upload "$tag" Horizon-Android.apk Horizon-Android.apk.sha256 source-commit.txt native-source-commit.txt
          gh release edit "$tag" --draft=false
