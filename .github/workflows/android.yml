name: android
on:
  workflow_dispatch:
    inputs:
      launcher_only:
        description: Reuse the verified build-9 native library if native sources are unchanged
        type: boolean
        default: false
      publish_release:
        description: Publish the verified APK as a GitHub prerelease
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
env:
  HORIZON_TELEMETRY_URL: 'off'
  ANDROID_TARGET: aarch64-linux-android
  ANDROID_API: '26'
  CARGO_INCREMENTAL: '0'
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Test resource import recovery
        run: |
          mkdir -p "$RUNNER_TEMP/resource-tests"
          javac -d "$RUNNER_TEMP/resource-tests" packaging/android/app/src/main/java/dev/horizon/android/PreparedResources.java packaging/android/tests/PreparedResourcesTest.java
          java -cp "$RUNNER_TEMP/resource-tests" dev.horizon.android.PreparedResourcesTest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.ANDROID_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/horizon-android
          shared-key: android-${{ env.ANDROID_TARGET }}
          cache-on-failure: true
      - name: Build shared game and launcher bridge
        env:
          HORIZON_MSA_CLIENT_ID: 331e08f8-172d-43b9-835a-3108c2fcdbf3
          LAUNCHER_ONLY: ${{ inputs.launcher_only }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android$ANDROID_API-clang"
          export CXX_aarch64_linux_android="$bin/aarch64-linux-android$ANDROID_API-clang++"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          so="crates/horizon-android/target/$ANDROID_TARGET/release/libhorizon_android.so"
          if [ "$LAUNCHER_ONLY" = true ]; then
            # This baseline was built with these exact native options. Reject a
            # launcher-only request if any engine, dependency or native build input changed.
            baseline=f4824eaf996638689302a2a38e5e7712d0eb1449
            test "$ANDROID_TARGET" = aarch64-linux-android
            test "$ANDROID_API" = 26
            test "$HORIZON_TELEMETRY_URL" = off
            test "$HORIZON_MSA_CLIENT_ID" = 331e08f8-172d-43b9-835a-3108c2fcdbf3
            git fetch --depth=1 origin "$baseline"
            git diff --name-only "$baseline" "$GITHUB_SHA" > "$RUNNER_TEMP/native-input-changes.txt"
            python3 - "$RUNNER_TEMP/native-input-changes.txt" <<'PYCODE'
          import pathlib, sys
          changed = pathlib.Path(sys.argv[1]).read_text().splitlines()
          forbidden = [p for p in changed if not (p.startswith("packaging/android/") or p in {".github/workflows/android.yml", ".gitignore", "THIRD_PARTY_NOTICES.md"})]
          if forbidden:
              raise SystemExit("Native inputs changed; run a full Android build: " + ", ".join(forbidden))
          PYCODE
            original="$RUNNER_TEMP/native-baseline"
            mkdir -p "$original" "$(dirname "$so")"
            gh release download android-v0.2.92-build-9 --repo "$GITHUB_REPOSITORY" --dir "$original" \
              --pattern 'Horizon-Android.apk*' --pattern source-commit.txt
            test "$(cat "$original/source-commit.txt")" = "$baseline"
            ( cd "$original" && sha256sum --check Horizon-Android.apk.sha256 )
            unzip -p "$original/Horizon-Android.apk" lib/arm64-v8a/libhorizon_android.so > "$so"
            printf '%s\n' "$baseline" > native-source-commit.txt
          else
            cargo build --release --locked --manifest-path crates/horizon-android/Cargo.toml --target "$ANDROID_TARGET"
            printf '%s\n' "$GITHUB_SHA" > native-source-commit.txt
          fi
          "$bin/llvm-nm" -D --defined-only "$so" > /tmp/horizon-symbols.txt
          grep -q ' ANativeActivity_onCreate$' /tmp/horizon-symbols.txt
          grep -q ' Java_dev_horizon_android_HorizonActivity_submit$' /tmp/horizon-symbols.txt
          python3 - <<'PYCODE'
          import pathlib, re
          java = pathlib.Path("packaging/android/app/src/main/java/dev/horizon/android/HorizonActivity.java").read_text()
          symbols = pathlib.Path("/tmp/horizon-symbols.txt").read_text()
          methods = re.findall(r"\bnative\s+[\w\[\]]+\s+(\w+)\(", java)
          missing = [m for m in methods if "Java_dev_horizon_android_HorizonActivity_" + m not in symbols]
          if missing:
              raise SystemExit("Missing JNI methods: " + ", ".join(missing))
          PYCODE
          mkdir -p packaging/android/app/src/main/jniLibs/arm64-v8a
          cp "$so" packaging/android/app/src/main/jniLibs/arm64-v8a/
      - name: Build and verify launcher APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          HORIZON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HORIZON_ANDROID_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export HORIZON_KEYSTORE="$RUNNER_TEMP/horizon.jks"
          trap 'rm -f "$HORIZON_KEYSTORE"' EXIT
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$HORIZON_KEYSTORE"
          else
            echo '::warning::No repository signing key configured. This prerelease uses a development key and cannot update an existing installation.'
            export HORIZON_KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            echo "::add-mask::$HORIZON_KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$HORIZON_KEYSTORE" -alias horizon -keyalg RSA -keysize 2048 -validity 10000 -storepass:env HORIZON_KEYSTORE_PASSWORD -keypass:env HORIZON_KEYSTORE_PASSWORD -dname 'CN=Horizon Android Development'
          fi
          gradle -p packaging/android --no-daemon assembleRelease lintRelease
          cp packaging/android/app/build/outputs/apk/release/app-release.apk Horizon-Android.apk
          tools=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify --verbose Horizon-Android.apk
          "$tools/aapt" dump badging Horizon-Android.apk | tee /tmp/horizon-badging.txt
          grep -q "launchable-activity: name='dev.horizon.android.HorizonActivity'" /tmp/horizon-badging.txt
          unzip -l Horizon-Android.apk | grep 'lib/arm64-v8a/libhorizon_android.so'
          sha256sum Horizon-Android.apk > Horizon-Android.apk.sha256
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: horizon-android
          path: |
            Horizon-Android.apk
            Horizon-Android.apk.sha256
            source-commit.txt
            native-source-commit.txt
          retention-days: 14
          if-no-files-found: error
  release:
    needs: apk
    if: inputs.publish_release && github.repository == 'OlahDavidXdd/horizon-ios' && github.ref == 'refs/heads/android-port'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: horizon-android
      - name: Publish APK from this successful build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(cat source-commit.txt)" = "$GITHUB_SHA"
          sha256sum --check Horizon-Android.apk.sha256
          tag="android-v0.2.97-build-${GITHUB_RUN_NUMBER}"
          cat > notes.md <<'NOTES'
          Repairs incomplete game-file imports where PNG textures exist but font, atlas, block-state and model definitions are missing. The launcher validates the source ZIP before import, keeps it open while native import runs, then checks the published folder and restores missing or truncated entries with CRC verification. Play stays disabled until verification completes.

          Existing incomplete installations must reimport the original Horizon-26.3.zip from Downloads. The ZIP does not need to be downloaded again. Malformed or incomplete archives are rejected before replacing existing game files. The launcher now checks the core font/model files instead of relying only on horizon-resources.json.

          Retains the interrupted glass-drag recovery from 0.2.96. Share Logs reports how many files were restored. Game assets are not bundled in the public APK.

          Builds without repository signing secrets use a development key: back up saves before replacing an existing installation.

          Source provenance is recorded in `source-commit.txt` (launcher) and `native-source-commit.txt` (game library). Launcher-only builds verify that native sources, dependencies and native build inputs are unchanged before reusing the verified build-9 game library.

          ARM64 Android 8+ with Vulkan. The web glass effect uses the installed Android System WebView. A renderer failure falls back to native navigation. Import prepared game files from your own copy of Minecraft. This APK contains no Mojang game assets.

          Includes worlds, servers, game-file import/download, resource and shader packs, content mods, settings, screenshots/log sharing, touch-layout editing, a native software-keyboard bridge, Android gamepad input, system clipboard access, and Microsoft device-code sign-in. Online sign-in requires Microsoft/Mojang application approval. This is a prerelease; physical-device gameplay and complete iOS feature parity are still being validated.
          NOTES
          gh release create "$tag" --target "$GITHUB_SHA" --title "Horizon Android 0.2.97 · build ${GITHUB_RUN_NUMBER}" --notes-file notes.md --prerelease --draft
          gh release upload "$tag" Horizon-Android.apk Horizon-Android.apk.sha256 source-commit.txt native-source-commit.txt
          gh release edit "$tag" --draft=false
