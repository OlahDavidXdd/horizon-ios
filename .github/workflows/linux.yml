name: linux
# The Linux game, built and seen: an optimized build of horizon-client and horizon-ctl (artifact linux-binary), then
# the fixed screenshot scenes of tools/ci/screenshots.py drawn by Mesa's software Vulkan (lavapipe) under xvfb
# (artifact linux-screenshots, with a contact sheet and a diff against the first good run's captures). fmt, clippy and
# the tests run in ci.yml's verify job, beside this one. See CI.md.
on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'PROJECT/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'PROJECT/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  HORIZON_TELEMETRY_URL: "off"
  # mold links the game in seconds instead of a minute.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the ALSA and udev headers and mold
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev libudev-dev mold
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-fast
          # Every push saves: a branch's next run starts warm.
          save-if: ${{ github.event_name != 'pull_request' }}
      # The `fast` profile (Cargo.toml): optimized, quick to link. What players run is the release profile; the two
      # draw the same frames.
      - name: Build the game
        run: cargo build --profile fast --locked -p horizon-client --bin horizon-client --bin horizon-ctl
      - name: Pack it
        run: |
          mkdir -p dist
          cp target/fast/horizon-client target/fast/horizon-ctl dist/
          tar -C dist -czf horizon-linux-x86_64.tar.gz horizon-client horizon-ctl
      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: horizon-linux-x86_64.tar.gz
          retention-days: 7

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
      - name: Install Mesa's software Vulkan, xvfb and the runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb libasound2t64 \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libx11-xcb1 python3-pil || \
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1 xvfb libasound2 \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2 libx11-xcb1 python3-pil
          tar -xzf horizon-linux-x86_64.tar.gz
      # The game files are the player's to bring, never this repository's: they come from the download server the
      # game itself uses (import::download), cached by the file's ETag so a run downloads them once.
      - name: Which game files
        id: files
        run: |
          tag=$(curl -sfI https://cdn.gayfeet.lol/horizon/26.3.zip | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}' | tr -dc 'A-Za-z0-9')
          echo "tag=${tag:-none}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: gamefiles
          key: gamefiles-26.3-${{ steps.files.outputs.tag }}
      - name: Download the game files
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sfL --retry 5 -C - -o files.zip https://cdn.gayfeet.lol/horizon/26.3.zip
          mkdir -p gamefiles && unzip -q files.zip -d gamefiles && rm files.zip
          ls gamefiles
      - name: Draw the scenes
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" python3 tools/ci/screenshots.py \
            --game ./horizon-client --ctl ./horizon-ctl --resources gamefiles/26.3 --out screenshots
      # The baseline is the first good run's captures, kept in the Actions cache (renders of Mojang's textures
      # stay out of Git). A new baseline: bump the key's version.
      - uses: actions/cache/restore@v4
        id: baseline
        with:
          path: baseline
          key: screenshot-baseline-linux-v1
      - name: Contact sheet and the difference from the baseline
        if: always()
        run: |
          python3 tools/ci/contact_sheet.py screenshots screenshots/sheet.png || true
          python3 tools/ci/screenshot_diff.py baseline screenshots >> "$GITHUB_STEP_SUMMARY" || \
            echo "::warning::scenes differ from the baseline: see the *.diff.png in linux-screenshots"
      - name: Keep these captures as the baseline
        if: steps.baseline.outputs.cache-hit != 'true' && success()
        run: mkdir -p baseline && cp screenshots/*.png baseline/ && rm -f baseline/sheet.png baseline/*.diff.png
      - uses: actions/cache/save@v4
        if: steps.baseline.outputs.cache-hit != 'true' && success()
        with:
          path: baseline
          key: screenshot-baseline-linux-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-screenshots
          path: screenshots
          retention-days: 14
